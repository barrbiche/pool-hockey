<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pool CH" />
    <meta name="theme-color" content="#0c1e3d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Pool de Hockey</title>
    <script>
      // Applique le thème AVANT le premier affichage, sinon le site
      // apparaîtrait une fraction de seconde en clair avant de basculer.
      // "auto" (ou rien de choisi) suit le réglage du téléphone.
      ;(function () {
        try {
          var choix = localStorage.getItem('theme')
          var sombre =
            choix === 'sombre' ||
            ((!choix || choix === 'auto') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', sombre ? 'dark' : 'light')
        } catch (e) {
          // navigation privée : on reste en clair, sans casser la page
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
